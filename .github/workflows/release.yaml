name: "Release Cross-Platform App"

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            upload_plain_binary: 'false'
          - platform: 'windows-latest'
            upload_plain_binary: 'true'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Required webkit & GTK dependencies for building AppImage/Linux binaries
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: 'Automated release generated by GitHub Actions. Download the installer or portable .exe from Assets below.'
          releaseDraft: false
          prerelease: false
          # Upload the raw Windows executable alongside the NSIS/MSI installers
          # so users can download a portable .exe (requires WebView2 runtime).
          uploadPlainBinary: ${{ matrix.upload_plain_binary }}
